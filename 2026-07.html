<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>July 2026 &mdash; JD Meyers</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E16;--bg2:#10141F;--bg3:#161B28;--bg4:#1B2130;
  --glass:rgba(255,255,255,.05);--glass-hi:rgba(255,255,255,.09);
  --b0:rgba(255,255,255,.10);--b1:rgba(255,255,255,.16);--b2:rgba(255,255,255,.26);
  --tx:#FFFFFF;--t2:rgba(255,255,255,.88);--t3:rgba(255,255,255,.66);--t4:rgba(255,255,255,.46);--t5:rgba(255,255,255,.32);
  --green:#3DDC97;--blue:#5CA8FF;--amber:#FFB84D;--red:#FF6B6B;--vio:#A78BFA;--rose:#FF8FB3;--teal:#2DD4CF;
  --gbg:rgba(255,184,77,.10);--sbg:rgba(61,220,151,.10);--kbg:rgba(92,168,255,.10);
  --serif:'Fraunces',serif;--sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  --r1:8px;--r2:12px;--r3:18px;--pill:999px;
  --sh1:0 8px 28px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
svg{display:block}
a{color:inherit}

/* ── ANIMATION 1: drifting gradient mesh ─────────────────────────────── */
@keyframes mesh-drift-1{0%{transform:translate(-8%,-10%) rotate(0deg) scale(1)}50%{transform:translate(10%,8%) rotate(8deg) scale(1.12)}100%{transform:translate(-8%,-10%) rotate(0deg) scale(1)}}
@keyframes mesh-drift-2{0%{transform:translate(6%,12%) rotate(0deg) scale(1.05)}50%{transform:translate(-12%,-6%) rotate(-10deg) scale(.92)}100%{transform:translate(6%,12%) rotate(0deg) scale(1.05)}}
@keyframes mesh-drift-3{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}50%{transform:translate(-50%,-50%) scale(1.25);opacity:.8}}
.mesh-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.mesh-blob{position:absolute;border-radius:50%;filter:blur(70px)}
.mesh-1{top:-10%;left:-8%;width:56vmax;height:56vmax;background:radial-gradient(circle,rgba(93,168,255,.18) 0%,transparent 68%);animation:mesh-drift-1 26s ease-in-out infinite}
.mesh-2{bottom:-15%;right:-10%;width:54vmax;height:54vmax;background:radial-gradient(circle,rgba(167,139,250,.16) 0%,transparent 68%);animation:mesh-drift-2 32s ease-in-out infinite}
.mesh-3{top:45%;left:48%;width:36vmax;height:36vmax;background:radial-gradient(circle,rgba(61,220,151,.13) 0%,transparent 70%);animation:mesh-drift-3 18s ease-in-out infinite}

@keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse-dot{0%,100%{opacity:1}45%,55%{opacity:.25}}
.ca{animation:fadeSlideIn .5s cubic-bezier(.22,.68,0,1.15) both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}

/* ── GLASS CARD SYSTEM (replaces March's flat .card/.sc) ─────────────── */
.card{background:var(--glass);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--b0);border-radius:var(--r3);padding:22px;box-shadow:var(--sh1);transition:border-color .3s ease,transform .25s cubic-bezier(.22,.68,0,1.15)}
.card:hover{border-color:var(--b1)}
.ch{margin-bottom:15px}
.ct{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--tx)}
.cs{font-size:11px;color:var(--t3);margin-top:3px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sf{grid-column:1/-1}
@media(max-width:860px){.cg{grid-template-columns:1fr}}

.sc{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--b0);border-radius:var(--r2);padding:16px;transition:border-color .3s ease}
.sgt{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:var(--t4);margin-bottom:10px}
.si{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--b0)}
.si:last-child{border-bottom:none}
.sk{font-size:11.5px;color:var(--t3)}
.sv{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--tx)}

.comm-note{margin-top:12px;padding:10px 13px;background:var(--glass);border-left:2px solid var(--amber);border-radius:0 var(--r1) var(--r1) 0;font-size:11px;color:var(--t2);line-height:1.6}
.cnl{font-family:var(--mono);font-size:8.5px;color:var(--amber);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}

/* ── HEADER + TAB NAV ─────────────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:100;margin:0 0 16px}
.hdr{margin:16px 20px 0;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;background:rgba(11,14,22,.85);backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--b0);border-radius:var(--r3)}
.hdr-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--t4);display:flex;align-items:center;gap:7px;margin-bottom:2px}
.hdr-dot{width:5px;height:5px;border-radius:50%;background:var(--teal);animation:pulse-dot 2.4s ease-in-out infinite}
.hdr-title{font-family:var(--serif);font-size:20px;font-weight:600}
.hdr-title strong{color:var(--teal)}
.hdr-nav{display:flex;gap:7px;align-items:center}
.hdr-link{font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);text-decoration:none;padding:7px 14px;border:1px solid var(--b0);border-radius:var(--pill);background:var(--glass);transition:all .22s cubic-bezier(.22,.68,0,1.15)}
.hdr-link:hover{color:var(--tx);border-color:var(--b2);transform:translateY(-2px)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 20px 0;padding:10px 12px;background:rgba(11,14,22,.85);backdrop-filter:blur(16px);border:1px solid var(--b0);border-radius:var(--r3)}
.tab-btn{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--t3);background:none;border:1px solid transparent;border-radius:var(--pill);padding:8px 16px;cursor:pointer;transition:all .22s cubic-bezier(.22,.68,0,1.15)}
.tab-btn:hover{color:var(--tx);background:var(--glass-hi)}
.tab-btn.on{color:var(--bg);background:var(--teal);box-shadow:0 4px 16px rgba(45,212,207,.35)}

.shell{max-width:1400px;margin:0 auto;padding:16px 20px 100px;position:relative;z-index:1}
.dash{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.dash{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:10px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding-bottom:8px;scrollbar-width:thin}
.main{min-width:0}

/* ── KPI TILES (Overview) ─────────────────────────────────────────────── */
.ov-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:700px){.ov-kpi-row{grid-template-columns:repeat(2,1fr)}}
.ov-kpi-tile{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--b0);border-radius:var(--r2);padding:14px 16px;cursor:pointer;transition:all .25s cubic-bezier(.22,.68,0,1.15)}
.ov-kpi-tile:hover{transform:translateY(-3px);border-color:var(--b2)}
.ov-kpi-k{font-family:var(--mono);font-size:9px;color:var(--t4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.ov-kpi-v{font-family:var(--serif);font-size:24px;font-weight:600}
.ov-kpi-sub{font-size:10px;color:var(--t4);margin-top:3px}

.ov-30sec{background:linear-gradient(160deg,rgba(45,212,207,.09),rgba(255,255,255,.03));border:1px solid var(--b0);border-radius:var(--r3);padding:20px 22px;margin-bottom:16px}
.ov-30sec-lbl{font-family:var(--mono);font-size:9px;color:var(--teal);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:12px}
.ov-bullets{display:flex;flex-direction:column;gap:9px}
.ov-bullet{font-size:12.5px;line-height:1.6;color:var(--t2)}
.ov-bullet b{color:var(--tx)}

.ov-charts-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media(max-width:760px){.ov-charts-row{grid-template-columns:1fr}}
.ov-chart-card{background:var(--glass);border:1px solid var(--b0);border-radius:var(--r2);padding:14px 16px}
.ov-chart-lbl{font-family:var(--mono);font-size:9px;color:var(--t4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}

.ov-timeline-row{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}
@media(max-width:800px){.ov-timeline-row{grid-template-columns:1fr}}
.ove{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--b0);font-size:11.5px}
.ove:last-child{border-bottom:none}
.oved{font-family:var(--mono);color:var(--t4);flex-shrink:0;width:52px}
.ovet{color:var(--t2)}
.ovs{cursor:pointer;transition:transform .2s ease}
.ovs:hover{transform:translateY(-2px)}
.ovsl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.ovr{display:flex;justify-content:space-between;padding:4px 0;font-size:11.5px;border-bottom:1px solid var(--b0)}
.ovr:last-child{border-bottom:none}
.ovrk{color:var(--t3)}
.ovrv{font-family:var(--mono);font-weight:600}
.ovrv.ok{color:var(--green)}
.ovrv.warn{color:var(--amber)}

/* ── CALENDAR ─────────────────────────────────────────────────────────── */
.sched-cell{position:relative;padding:5px 3px;border-radius:var(--r1);cursor:default;min-height:38px}
#daySpendTooltip,.cal-tooltip-fixed{position:fixed;background:var(--bg3);border:1px solid var(--b2);border-radius:var(--r1);padding:8px 12px;font-size:11px;color:var(--t2);pointer-events:none;z-index:9999;opacity:0;transition:opacity .15s;max-width:240px;box-shadow:var(--sh1)}

/* ── PHYSICAL: insight cards + sparklines ─────────────────────────────── */
.aftrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--b0);cursor:pointer}
.aftrow:last-child{border-bottom:none}
.aftn{flex:0 0 140px;color:var(--t2)}
.aftbw{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.aftbf{height:100%;border-radius:3px;transition:width 1.1s cubic-bezier(.22,.68,0,1.2)}
.aftp{width:32px;text-align:right;font-family:var(--mono)}

/* ── FINANCIAL ────────────────────────────────────────────────────────── */
.fsg{display:flex;gap:10px;margin-bottom:16px}
.fkpi{flex:1;background:var(--glass);border:1px solid var(--b0);border-radius:var(--r2);padding:14px;text-align:center}
.fkpiv{font-family:var(--serif);font-size:22px;font-weight:600}
.fkpik{font-family:var(--mono);font-size:9px;color:var(--t4);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}

.fcat{margin-bottom:2px;border-radius:var(--r1);overflow:hidden}
.fcath{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;cursor:pointer;transition:background .2s ease}
.fcath:hover{background:var(--glass)}
.fcatl{display:flex;align-items:center;gap:8px}
.fcatdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.fcatn{font-size:12.5px;color:var(--t2)}
.fcatnt{font-family:var(--mono);font-size:9px;color:var(--t4);margin-left:6px}
.fcatr{display:flex;align-items:center;gap:8px}
.fcatp{font-family:var(--mono);font-size:10px;color:var(--t4)}
.fcata{color:var(--t4);transition:transform .2s ease}
.fcat.open .fcata{transform:rotate(90deg)}
.fcatamt{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--tx)}
.fcatbar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin:0 4px 4px}
.fcatbf{height:100%;border-radius:2px}
.fcatb{max-height:0;overflow:hidden;transition:max-height .4s ease}
.fcat.open .fcatb{max-height:420px;overflow-y:auto}
.ftx{display:flex;justify-content:space-between;padding:4px 10px;font-size:11px;border-bottom:1px solid var(--b0)}
.ftxd{font-family:var(--mono);color:var(--t4)}
.ftxn{color:var(--t2);flex:1;padding:0 8px}
.ftxa{font-family:var(--mono);font-weight:600}
.ftxa.neg{color:var(--red)}
.ftxa.pos{color:var(--green)}
.inrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--b0)}
.inlbl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t2)}
.indot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.inamt{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--green)}

.pb-stat{background:var(--glass);border:1px solid var(--b0);border-radius:var(--r2);padding:12px 13px}
.pb-k{font-family:var(--mono);font-size:8.5px;color:var(--t4);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.pb-v{font-family:var(--serif);font-size:19px;font-weight:600}
.pb-d{font-size:10px;color:var(--t4);margin-top:3px}
.delta-up{color:var(--green)}.delta-dn{color:var(--amber)}

/* ── CREATIVE ─────────────────────────────────────────────────────────── */
.pjcard{background:var(--glass);border:1px solid var(--b0);border-radius:var(--r2);padding:16px 18px;margin-bottom:10px}
.sbadge{font-family:var(--mono);font-size:8.5px;padding:3px 9px;border-radius:var(--pill);text-transform:uppercase;letter-spacing:.5px}
.ptbl{width:100%;border-collapse:collapse;font-size:11.5px}
.ptbl th{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--t4);text-align:left;padding:6px 8px;border-bottom:1px solid var(--b1)}
.ptbl td{padding:7px 8px;border-bottom:1px solid var(--b0)}

.secdiv{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.secacc{width:3px;height:14px;border-radius:2px}
.sectit{font-family:var(--serif);font-size:13px;font-weight:600;font-style:italic}

.badge{font-family:var(--mono);font-size:8px;padding:2px 8px;border-radius:var(--pill);text-transform:uppercase;letter-spacing:.5px}
.ipr{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--b0)}
.imo{font-family:var(--mono);font-size:10px;color:var(--t4)}
.itop{font-size:11.5px;color:var(--t2)}
.ibadge{font-family:var(--mono);font-size:8px;padding:2px 8px;border-radius:var(--pill)}

.footer{text-align:center;margin-top:36px;padding-top:18px;border-top:1px solid var(--b0)}
.footer-text{font-family:var(--mono);font-size:9px;color:var(--t4)}
#btt{position:fixed;bottom:22px;right:22px;width:42px;height:42px;border-radius:50%;background:var(--bg3);border:1px solid var(--b1);color:var(--t2);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease,transform .25s ease;z-index:90}
#btt.show{opacity:1;visibility:visible}
#btt:hover{transform:translateY(-3px)}
</style>
</head>

<div class="mesh-bg"><div class="mesh-blob mesh-1"></div><div class="mesh-blob mesh-2"></div><div class="mesh-blob mesh-3"></div></div>

<div class="topbar" id="topbar">
<div class="hdr">
  <div>
    <div class="hdr-eyebrow"><span class="hdr-dot"></span>Month 7 of 12 &middot; <span id="mlbl"></span></div>

</div>

<div id="daySpendTooltip" class="cal-tooltip-fixed"></div>

<script>
const TABS=['overview','spiritual','physical','financial','intellectual','creative','reflections'];
const TAB_LABELS={overview:'Overview',spiritual:'Spiritual',physical:'Physical',financial:'Financial',intellectual:'Intellectual',creative:'Creative',reflections:'Reflections'};
let tab='overview';

// ── HELPERS ──────────────────────────────────────────────────────────
function spark(vals, color){
  const w=90,h=22,pad=3;
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const xs=vals.map((_,i)=>pad+i*(w-2*pad)/(vals.length-1));
  const ys=vals.map(v=>h-pad-(mx===mn?h/2-pad:(v-mn)/(mx-mn)*(h-2*pad)));
  const pts=xs.map((x,i)=>`${x},${ys[i]}`).join(' ');
  const circles=xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="2.5" fill="${color}"/>`).join('');
  return `<svg width="${w}" height="${h}" style="flex-shrink:0;overflow:visible"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>${circles}</svg>`;
}
function miniBar(vals,color,labels,fmtFn){
  const max=Math.max(...vals);
  return vals.map((v,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">
    <div style="width:100%;background:rgba(255,255,255,.06);border-radius:3px 3px 0 0;height:44px;display:flex;align-items:flex-end;overflow:hidden">
      <div style="width:100%;background:${color};opacity:${.5+.5*(v/max)};height:${Math.max(8,(v/max*100)).toFixed(0)}%;transition:height 1s cubic-bezier(.22,.68,0,1.2);border-radius:3px 3px 0 0"></div>
    </div>
    <div style="font-family:var(--mono);font-size:9px;color:var(--t3)">${fmtFn(v)}</div>
    <div style="font-family:var(--mono);font-size:8px;color:var(--t5)">${labels[i]}</div>
  </div>`).join('');
}
window.sw=function(t){
  tab=t; render();
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
};
window.toggleFin=function(id){ document.getElementById(id)?.classList.toggle('open'); };

  const Y=D.year;

      <div class="comm-note" style="margin-top:14px"><span class="cnl">July Status</span>Coursework is on break, but July's intellectual energy went into self-directed reading instead of sitting empty &mdash; see below.</div>
    </div>

    <div class="card sf ca d2" style="border-top:2px solid var(--vio)">
      <div class="ch"><div class="ct">Currently Studying: Modern Military Strategy &amp; Doctrine</div><div class="cs">Self-directed field reference, outside the formal MBA plan</div></div>
      <p style="font-size:12.5px;line-height:1.75;color:var(--t2);margin-bottom:14px">A dense field reference covering how military strategy actually gets analyzed: the three-level framework every doctrine sits inside, the nine classic Principles of War, and roughly twenty named doctrines from Deterrence Theory to Multi-Domain Operations, each with a plain-language definition, a historical origin, a modern example, and a documented case where it failed. About a third of the document is a deep dive into what the Russia-Ukraine war has actually changed in US Army doctrine, and it closes with eleven historical case studies compared side by side.</p>

      <div class="p-eyebrow" style="margin-bottom:8px">The Framework Everything Sits Inside</div>
      <div class="cg" style="grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
        <div class="pb-stat"><div class="pb-k" style="color:var(--vio)">Strategic</div><div style="font-size:11px;color:var(--t2);line-height:1.5;margin-top:4px">National/theater goals &mdash; why fight at all, and what &ldquo;winning&rdquo; even means</div></div>
        <div class="pb-stat"><div class="pb-k" style="color:var(--blue)">Operational</div><div style="font-size:11px;color:var(--t2);line-height:1.5;margin-top:4px">Campaign design &mdash; how battles get sequenced to reach the strategic goal</div></div>
        <div class="pb-stat"><div class="pb-k" style="color:var(--teal)">Tactical</div><div style="font-size:11px;color:var(--t2);line-height:1.5;margin-top:4px">The fight itself &mdash; how one unit wins one specific engagement, today</div></div>
      </div>
      <p style="font-size:11px;color:var(--t3);line-height:1.6;margin-bottom:16px">The book&rsquo;s core warning: confusing these levels is the most common analysis error &mdash; a force can win every tactical fight and still lose the war if the operational campaign or strategic objective was flawed. Vietnam is the textbook case: the US treated enemy battlefield manpower as the center of gravity, won most engagements, and still lost, because the real center of gravity was American domestic political will, a target it never defended.</p>

      <div class="p-eyebrow" style="margin-bottom:8px">Doctrines Covered, by Level</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">
        ${[['Deterrence Theory','var(--vio)'],['Proxy Warfare','var(--vio)'],['Island Chain Strategy','var(--vio)'],['Gray Zone / Hybrid Warfare','var(--vio)'],['Cost-Imposition Strategy','var(--vio)'],
           ['A2/AD','var(--blue)'],['Multi-Domain Operations','var(--blue)'],['Counterinsurgency (COIN)','var(--blue)'],['Attrition vs. Maneuver','var(--blue)'],
           ['Combined Arms Maneuver','var(--teal)'],['Asymmetric Warfare','var(--teal)'],['Information Warfare','var(--teal)'],['Network-Centric Warfare','var(--teal)'],['Electronic Warfare','var(--teal)'],['Cyber Warfare','var(--teal)'],
           ['Center of Gravity Analysis','var(--amber)'],['Deception / OPSEC','var(--amber)'],['Space &amp; Counter-Space','var(--amber)']]
          .map(([n,c])=>`<span style="font-family:var(--mono);font-size:9px;padding:4px 10px;border-radius:var(--pill);background:${c}22;color:${c};border:1px solid ${c}44">${n}</span>`).join('')}
      </div>

      <div class="p-eyebrow" style="margin-bottom:8px">Case Studies That Stood Out</div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-bottom:16px">
        <div style="display:flex;gap:10px"><span style="font-family:var(--mono);font-size:9px;color:var(--t4);flex:0 0 76px;padding-top:1px">1950 Inchon</span><span style="font-size:11px;color:var(--t2);line-height:1.5">MacArthur landed at the one port North Korea hadn&rsquo;t bothered defending, because it looked too difficult to matter &mdash; a single strike at the real center of gravity reversed a nearly-lost war in days.</span></div>
        <div style="display:flex;gap:10px"><span style="font-family:var(--mono);font-size:9px;color:var(--t4);flex:0 0 76px;padding-top:1px">Cuban Missile Crisis</span><span style="font-size:11px;color:var(--t2);line-height:1.5">Kennedy rejected both extremes (airstrike or nothing) for a blockade that signaled resolve while leaving Khrushchev a face-saving way to back down &mdash; deterrence only works if the other side has an exit that isn&rsquo;t humiliation.</span></div>
        <div style="display:flex;gap:10px"><span style="font-family:var(--mono);font-size:9px;color:var(--t4);flex:0 0 76px;padding-top:1px">2024 Kursk</span><span style="font-size:11px;color:var(--t2);line-height:1.5">Ukraine achieved genuine surprise despite a fully sensor-covered battlefield &mdash; proof that raw data (transparency) and correctly reading that data (understanding) aren&rsquo;t the same thing.</span></div>
      </div>

      <div class="p-eyebrow" style="margin-bottom:8px">The Ukraine War Section</div>
      <p style="font-size:11.5px;line-height:1.7;color:var(--t2);margin-bottom:10px">Roughly a third of the reference is dedicated specifically to what the US Army is institutionally changing because of Ukraine: EW pushed down from corps-level units to individual squads, drone-in-every-squad by end of 2026, and a basic economics problem &mdash; a $400&#8211;500 FPV drone routinely destroys an $8&#8211;10 million tank, and interceptor missiles now cost more than the drones they shoot down. The single line that stuck: <em style="color:var(--tx);font-style:italic">&ldquo;visibility is not the same as understanding.&rdquo;</em></p>
      <div class="cg" style="grid-template-columns:repeat(3,1fr);gap:8px">
        <div class="pb-stat"><div class="pb-k">FPV Drone Cost</div><div class="pb-v" style="font-size:14px;color:var(--green)">$400&#8211;500</div><div class="pb-d">vs. $8&#8211;10M per tank</div></div>
        <div class="pb-stat"><div class="pb-k">Operation Spiderweb</div><div class="pb-v" style="font-size:14px;color:var(--amber)">~$7B</div><div class="pb-d">damage from ~117 drones</div></div>
        <div class="pb-stat"><div class="pb-k">Army Drone Goal</div><div class="pb-v" style="font-size:14px;color:var(--blue)">10,000+/mo</div><div class="pb-d">domestic production, 2026</div></div>
      </div>
    </div>
  </div>`;
}

// ── CREATIVE ─────────────────────────────────────────────────────────

      </div>
      <div class="comm-note" style="margin-top:14px"><span class="cnl">Goal Check</span>6-shoot goal already cleared (${totalShoots} non-cancelled bookings logged this year). Weddings sit at ${weddings} of the 3&#8211;4 target.</div>
    </div>
    <div class="card sf ca d2">
      <div class="secdiv"><div class="secacc" style="background:var(--rose)"></div><div class="sectit">July Creative &mdash; Partial Data</div></div>
      <p style="font-size:13px;line-height:1.78;color:var(--t2);margin-top:10px">${cr.note}</p>

}

// ── SIDEBAR (Year Progress timeline + Self-Assessment) ──────────────────
function buildSidebar(){
  const months=[
    {m:'Jan',net:865,gym:13,sub:'Net +$865 &middot; 13 gym days'},
    {m:'Feb',net:1094,gym:18,sub:'Net +$1,094 &middot; 18 gym days'},
    {m:'Mar',net:1444,gym:20,sub:'Net +$1,444 &middot; 20 gym days'},
    {m:'Apr',net:4234,gym:24,sub:'Net +$4,234 &middot; 24 gym days'},
    {m:'May',net:2883,gym:20,sub:'Net +$2,883 &middot; 20 gym days'},
    {m:'Jun',net:2464,gym:21,sub:'Net +$2,464 &middot; 21 gym days'},
    {m:'Jul',net:600,gym:18,sub:'Net +$600 MTD &middot; 18 gym days',cur:true},
    {m:'Aug'},{m:'Sep'},{m:'Oct'},{m:'Nov'},{m:'Dec'},
  ];
  const tl=months.map((item,i)=>{
    const done = item.net !== undefined && !item.cur;
    const col = item.cur ? 'var(--amber)' : done ? 'var(--green)' : 'var(--t5)';
    return `<div style="display:flex;gap:10px;align-items:flex-start;padding-bottom:${i<11?'10px':'0'}">
      <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">
        <div style="width:8px;height:8px;border-radius:50%;background:${item.cur?'var(--amber)':done?'var(--green)':'transparent'};border:1.5px solid ${col}"></div>
        ${i<11?`<div style="width:1px;flex:1;min-height:18px;background:${done?'var(--green)':'var(--b1)'};margin-top:2px"></div>`:''}
      </div>
      <div style="padding-bottom:2px">
        <div style="font-family:var(--mono);font-size:10px;color:${col};font-weight:${item.cur?700:400}">${item.m}${item.cur?' (current)':''}</div>
        ${item.sub?`<div style="font-size:10px;color:var(--t3);margin-top:2px;line-height:1.4">${item.sub}</div>`:''}
      </div>
    </div>`;
  }).join('');

  return `<div class="sc ca" style="border-top:2px solid var(--amber)">
    <div class="sgt">2026 Year Progress</div>
    <div>${tl}</div>
  </div>
  <div class="sc ca d1" style="border-top:2px solid var(--amber)">
    <div class="sgt" style="color:var(--amber)">July Self-Assessment</div>
    <div style="margin-bottom:12px">
      <div style="font-family:var(--mono);font-size:9px;color:var(--green);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;display:flex;align-items:center;gap:5px"><span style="width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block"></span>Keep Doing</div>
      <div style="font-size:11.5px;color:var(--t2);line-height:1.6;margin-bottom:5px">Cardio diversity. Frisbee, soccer, and real runs kept training genuinely enjoyable instead of grinding the treadmill.</div>
      <div style="font-size:11.5px;color:var(--t2);line-height:1.6">Career momentum. The Clarkson offer moved from signed to started inside two weeks, with a resignation handled cleanly in between.</div>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-family:var(--mono);font-size:9px;color:var(--blue);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;display:flex;align-items:center;gap:5px"><span style="width:5px;height:5px;border-radius:50%;background:var(--blue);display:inline-block"></span>Improve</div>
      <div style="font-size:11.5px;color:var(--t2);line-height:1.6;margin-bottom:5px">Strength numbers slipped while cardio took the spotlight. Both can coexist with a little more intent.</div>
      <div style="font-size:11.5px;color:var(--t2);line-height:1.6">July 12th sermon notes are missing. Worth a habit check heading into August.</div>
    </div>
    <div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--red);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;display:flex;align-items:center;gap:5px"><span style="width:5px;height:5px;border-radius:50%;background:var(--red);display:inline-block"></span>Correct</div>
      <div style="font-size:11.5px;color:var(--t2);line-height:1.6">2-mile run remains untested against the AFT standard, with no test date set. That needs to happen before it becomes a recurring gap.</div>

}

// ── RENDER DISPATCHER ─────────────────────────────────────────────────
function render(){
  const el=document.getElementById('main');
  if(tab==='overview')el.innerHTML=rOverview();
  if(tab==='spiritual')el.innerHTML=rSpiritual();
  if(tab==='physical')el.innerHTML=rPhysical();
  if(tab==='financial')el.innerHTML=rFinancial();
  if(tab==='intellectual')el.innerHTML=rIntellectual();
  if(tab==='creative')el.innerHTML=rCreative();
  if(tab==='reflections')el.innerHTML=rReflections();
  document.getElementById('sidebar').innerHTML=buildSidebar();
  document.getElementById('mlbl').textContent=TAB_LABELS[tab];
  initCountUps();
}

// ── ANIMATION 2: count-up (applied to KPI/fkpi values on render) ───────
function initCountUps(){
  // no-op placeholder retained for structure; numeric values already
  // render directly since content is rebuilt per tab switch. Entrance
  // animation is handled by the .ca fadeSlideIn keyframe on every widget.
}

function buildTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t=>
    `<button class="tab-btn${t===tab?' on':''}" data-tab="${t}" onclick="sw('${t}')">${TAB_LABELS[t]}</button>`
  ).join('');
}

buildTabs();
render();

function syncSidebarOffset(){
  const topbar=document.getElementById('topbar');
  const side=document.getElementById('sidebar');
  if(!topbar||!side) return;
  const h=topbar.getBoundingClientRect().height;
  side.style.top=(h+16)+'px';
  side.style.maxHeight='calc(100vh - '+(h+32)+'px)';
}
syncSidebarOffset();
window.addEventListener('resize', syncSidebarOffset);
// Fonts loading async can change topbar height after first paint; re-sync once settled.
window.addEventListener('load', syncSidebarOffset);
setTimeout(syncSidebarOffset, 300);
setTimeout(syncSidebarOffset, 1000);

window.addEventListener('scroll', () => {
  const btt=document.getElementById('btt');
  if(window.scrollY > 500) btt.classList.add('show');
  else btt.classList.remove('show');
}, { passive: true });
</script>
